# This workflow does NOT run in this repo. build.sh ships it into the public
# distribution repo (ONIK-IO/lens-wp), where it runs. See public-repo/README.md.
name: Release

# Fires when a release PR is merged into main. The release is therefore cut from what is
# actually on main — not from a branch that might never be accepted. build.sh --push only
# pushes the release branch and opens the PR; it creates no tag and no release.
on:
  push:
    branches: [main]

# Needed to create the tag, the release, and upload its assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The plugin header on main is the single source of truth for the version — it is
      # what WordPress itself reads, and build.sh has already substituted it.
      - name: Read version from the plugin header
        id: version
        run: |
          version=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\(.*\)$/\1/p' onik-images.php | head -1 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::Could not read Version from onik-images.php header"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version on main: $version"

      # Merges to main that are not a version bump (a docs fix, say) must not try to
      # re-release an existing version.
      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} is already released — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # WordPress unpacks the zip straight into wp-content/plugins/, so the archive must
      # contain a single top-level onik-lens/ folder. GitHub's own auto-generated source
      # archives are rooted at lens-wp-<tag>/ instead, which installs under the wrong
      # directory name — that is exactly what this asset exists to replace.
      # One asset, onik-lens.zip. The version is carried by the release itself, so there is
      # nothing to encode in the filename — and a fixed name is what makes
      # /releases/latest/download/onik-lens.zip a stable URL.
      - name: Build the installable zip
        if: steps.check.outputs.already == 'false'
        run: |
          set -euo pipefail
          mkdir -p build/onik-lens
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' ./ build/onik-lens/
          (cd build && zip -qr onik-lens.zip onik-lens)

          roots=$(unzip -Z1 build/onik-lens.zip | cut -d/ -f1 | sort -u)
          if [ "$roots" != "onik-lens" ]; then
            echo "::error::Zip must contain exactly one root folder (onik-lens), found: $roots"
            exit 1
          fi

      # gh release create tags --target itself, so the tag lands on the merge commit that
      # is on main. No tag is ever pushed for a change that was not accepted.
      # Published as a PRE-RELEASE, deliberately. Merging to main cuts the release, but does
      # not bless it: GitHub excludes prereleases from /releases/latest/, so the stable
      # download URL keeps serving the last promoted release until a human is satisfied with
      # this one and clears the "pre-release" flag on it (Releases -> Edit -> uncheck
      # "Set as a pre-release", tick "Set as the latest release"). Until then, nobody
      # downloading the latest URL gets an unvetted build.
      - name: Publish the release (pre-release)
        if: steps.check.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            --prerelease \
            --notes "ONIK Lens v${VERSION}

          **Pre-release.** Not yet promoted, so the always-current download URL below still points at the previous release. Promote this one by editing the release: uncheck *Set as a pre-release*, tick *Set as the latest release*.

          Install the attached \`onik-lens.zip\` via wp-admin → Plugins → Add New → Upload Plugin.

          Always-current download (serves the latest **promoted** release):
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/onik-lens.zip

          Do not use the auto-generated \"Source code\" archives below: GitHub roots those at \`lens-wp-${VERSION}/\`, so they install under the wrong directory name. The attached zip unpacks to \`onik-lens/\`." \
            build/onik-lens.zip
