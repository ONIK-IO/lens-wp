# This workflow does NOT run in this repo. build.sh ships it into the public
# distribution repo (ONIK-IO/lens-wp), where it runs. See public-repo/README.md.
name: Release

# Fires when a release PR is merged into main. The release is therefore cut from what is
# actually on main — not from a branch that might never be accepted. build.sh --push only
# pushes the release branch and opens the PR; it creates no tag and no release.
on:
  push:
    branches: [main]

# Needed to create the tag, the release, and upload its assets.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The plugin header on main is the single source of truth for the version — it is
      # what WordPress itself reads, and build.sh has already substituted it.
      - name: Read version from the plugin header
        id: version
        run: |
          version=$(sed -n 's/^[[:space:]]*\*[[:space:]]*Version:[[:space:]]*\(.*\)$/\1/p' onik-images.php | head -1 | tr -d '[:space:]')
          if [ -z "$version" ]; then
            echo "::error::Could not read Version from onik-images.php header"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version on main: $version"

      # A pre-release suffix on that version is the ONLY switch. There is no second flag to
      # forget to flip: 0.18.260820-dev publishes as a pre-release, 0.18.260820 publishes as
      # the latest release, and the header build.sh stamped decides which.
      #
      # In normal use this only ever sees a bare version. Pre-releases are tagged and
      # published by `build.sh --push` directly and never merged, so main carries a
      # stable-only history. The pre-release branch below is the defensive case: if a -dev
      # payload does reach main somehow, publish it as what it actually is rather than
      # blessing it as the latest release.
      #
      # The suffix set is checked here as well as in build.sh, because the two consequences
      # of getting it wrong are not symmetrical. `-patch1`, `-pl1` and `-p1` are all valid
      # Composer versions of STABLE stability — tag one of those and the "pre-release" goes
      # out on Packagist as the newest stable version, into everyone's `composer update`,
      # while GitHub still shows it as unreleased. Refuse to publish rather than guess.
      - name: Classify the release
        id: kind
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          suffix="${version#*-}"
          if [ "$suffix" = "$version" ]; then
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "v${version} will be published as the LATEST release."
          elif printf '%s' "$suffix" | grep -Eq '^(dev|(alpha|a|beta|b|RC|rc)[0-9]*)$'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "v${version} will be published as a PRE-RELEASE (Composer stability: ${suffix})."
          else
            echo "::error::Version suffix '-${suffix}' is not one Composer treats as unstable. Use dev, alpha[N], a[N], beta[N], b[N], RC[N] or rc[N]."
            exit 1
          fi

      # Merges to main that are not a version bump (a docs fix, say) must not try to
      # re-release an existing version.
      - name: Skip if this version is already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} is already released — nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      # WordPress unpacks the zip straight into wp-content/plugins/, so the archive must
      # contain a single top-level onik-lens/ folder. GitHub's own auto-generated source
      # archives are rooted at lens-wp-<tag>/ instead, which installs under the wrong
      # directory name — that is exactly what this asset exists to replace.
      # One asset, onik-lens.zip. The version is carried by the release itself, so there is
      # nothing to encode in the filename — and a fixed name is what makes
      # /releases/latest/download/onik-lens.zip a stable URL.
      - name: Build the installable zip
        if: steps.check.outputs.already == 'false'
        run: |
          set -euo pipefail
          mkdir -p build/onik-lens
          rsync -a --exclude '.git' --exclude '.github' --exclude 'build' ./ build/onik-lens/
          (cd build && zip -qr onik-lens.zip onik-lens)

          roots=$(unzip -Z1 build/onik-lens.zip | cut -d/ -f1 | sort -u)
          if [ "$roots" != "onik-lens" ]; then
            echo "::error::Zip must contain exactly one root folder (onik-lens), found: $roots"
            exit 1
          fi

      # gh release create tags --target itself, so the tag lands on the merge commit that
      # is on main. No tag is ever pushed for a change that was not accepted.
      #
      # --prerelease and --latest are both about GitHub only. Packagist ignores them
      # entirely and reads the tag name, which is why the suffix has to be in the tag and
      # not just in the flag. The two settings agree here because they come from the same
      # place: the version in the plugin header.
      - name: Publish the release
        if: steps.check.outputs.already == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          IS_PRERELEASE: ${{ steps.kind.outputs.prerelease }}
        run: |
          set -euo pipefail

          install_note="Install the attached \`onik-lens.zip\` via wp-admin → Plugins → Add New → Upload Plugin.

          Do not use the auto-generated \"Source code\" archives below: GitHub roots those at \`lens-wp-${VERSION}/\`, so they install under the wrong directory name. The attached zip unpacks to \`onik-lens/\`."

          if [ "$IS_PRERELEASE" = "true" ]; then
            flags=(--prerelease)
            notes="ONIK Lens v${VERSION}

          **Pre-release.** Nothing picks this up on its own:

          * Composer reads the version suffix as unstable, so \`composer require onik/lens-wp\` on Packagist keeps resolving to the last stable release.
          * GitHub excludes pre-releases from /releases/latest/, so the in-dashboard update checker does not offer it and the stable download URL still serves the previous release.

          ${install_note}

          The stable build of this version ships as its own tag once this one has been tested."
          else
            flags=(--latest)
            notes="ONIK Lens v${VERSION}

          This is the current release. It is what /releases/latest/download/onik-lens.zip serves, what the in-dashboard update checker offers to existing installs, and the newest stable version on Packagist.

          ${install_note}

          Always-current download:
          https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/onik-lens.zip"
          fi

          gh release create "v${VERSION}" \
            --target "${GITHUB_SHA}" \
            --title "v${VERSION}" \
            "${flags[@]}" \
            --notes "$notes" \
            build/onik-lens.zip
